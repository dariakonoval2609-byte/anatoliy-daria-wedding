<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f1e8">
<title>Дар’я &amp; Анатолій · 17 липня 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#f5f1e8;
  --paper:#fbf9f3;
  --blue:#687b91;
  --blue-deep:#43556c;
  --gold:#b49a6c;
  --ink:#536174;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e9e5dc}
body{min-height:100svh;display:grid;place-items:center;color:var(--ink);font-family:Montserrat,sans-serif}
button{font:inherit}
.stage{
  isolation:isolate;position:relative;width:min(100%,480px);height:100svh;min-height:640px;max-height:940px;
  overflow:hidden;background:var(--ivory);box-shadow:0 20px 80px rgba(50,58,67,.16)
}
.stage:before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.14;
  background-image:radial-gradient(#a79d8c 0.45px,transparent .65px);background-size:5px 5px
}
.invitation-card{
  position:absolute;inset:0;z-index:1;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse at 64% 34%,rgba(255,255,255,.72),transparent 52%),
    linear-gradient(145deg,#fbf9f3,#f2eee4);
  opacity:0;transform:translateY(14%) scale(.97);
  transition:opacity 1s ease .32s,transform 1.15s cubic-bezier(.18,.72,.2,1) .16s
}
.stage.open .invitation-card{opacity:1;transform:translateY(0) scale(1)}
.paper-edge{position:absolute;inset:17px;border:1px solid rgba(177,158,124,.3);pointer-events:none}
.pampas{
  position:absolute;left:-10%;bottom:1%;width:73%;height:76%;
  opacity:.66;filter:drop-shadow(1px 2px 2px rgba(255,255,255,.6))
}
.invite-copy{position:relative;z-index:2;width:90%;margin-left:13%;padding:34px 22px 42px;text-align:center}
.eyebrow{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:#7d8792;margin:0 0 32px}
.invite-name{
  margin:0;color:var(--blue-deep);font-family:"Cormorant Garamond",serif;font-weight:300;
  font-size:clamp(43px,11vw,61px);line-height:.98;letter-spacing:.08em;text-transform:uppercase
}
.joiner{margin:7px 0 5px;color:#7c8795;font:italic 36px "Great Vibes",cursive}
.date{
  margin:34px 0 11px;color:var(--blue-deep);font-family:"Cormorant Garamond",serif;
  font-size:24px;letter-spacing:.16em
}
.rule{width:42px;height:1px;margin:17px auto;background:var(--gold);opacity:.75}
.place{font-family:"Cormorant Garamond",serif;font-size:21px;color:#59687a;line-height:1.3}
.place small{display:block;margin-top:6px;font:9px Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#858a8d}
.invite-note{max-width:260px;margin:22px auto 0;font:italic 16px/1.5 "Cormorant Garamond",serif;color:#777f87}
.envelope{
  position:absolute;inset:0;z-index:5;overflow:hidden;
  background:linear-gradient(150deg,#e9e5dc 0%,#f7f3eb 50%,#e8e3d9 100%);
  transition:visibility 0s linear 1.65s
}
.stage.open .envelope{visibility:hidden}
.env-texture{
  position:absolute;inset:0;opacity:.18;pointer-events:none;
  background:radial-gradient(ellipse at 50% 48%,transparent 15%,rgba(127,122,111,.12) 100%)
}
.fold{
  position:absolute;inset:0;transition:transform 1.25s cubic-bezier(.22,.72,.18,1),opacity .9s ease;
  backface-visibility:hidden
}
.fold-top{
  z-index:3;clip-path:polygon(0 0,100% 0,50% 51%);
  background:linear-gradient(160deg,#e9e5dc,#f7f4ed 55%,#dcd9d1);
  transform-origin:50% 0;filter:drop-shadow(0 3px 5px rgba(73,81,89,.12))
}
.fold-bottom{
  z-index:2;clip-path:polygon(0 100%,0 48%,50% 76%,100% 48%,100% 100%);
  background:linear-gradient(15deg,#e5e1d8,#f5f1e9 55%,#dedbd2)
}
.fold-left{
  z-index:2;clip-path:polygon(0 0,50% 50%,0 100%);
  background:linear-gradient(105deg,#ece8df,#f8f5ee 75%,#e0ddd5)
}
.fold-right{
  z-index:2;clip-path:polygon(100% 0,50% 50%,100% 100%);
  background:linear-gradient(255deg,#e8e4db,#f8f5ee 75%,#dedbd2)
}
.envelope-botanical{
  position:absolute;z-index:4;left:50%;top:-3%;width:min(110%,520px);height:31%;
  transform:translateX(-50%);opacity:.42;pointer-events:none;
  transition:opacity .7s ease,transform 1.1s ease
}
.stage.open .fold-top{transform:rotateX(180deg);opacity:.35}
.stage.open .fold-bottom{transform:translateY(110%)}
.stage.open .fold-left{transform:translateX(-110%)}
.stage.open .fold-right{transform:translateX(110%)}
.stage.open .envelope-botanical{opacity:0;transform:translate(-50%,-20%)}
.seal{
  position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);
  width:94px;height:94px;border:0;border-radius:50%;cursor:pointer;color:#665943;
  background:radial-gradient(circle at 34% 28%,#fffdf6,#e7dfcf 69%,#d8cebb);
  box-shadow:0 6px 18px rgba(66,70,72,.14),inset 0 0 0 1px rgba(171,152,119,.65),inset 0 0 0 5px rgba(255,255,255,.42);
  transition:transform .45s ease,opacity .45s ease
}
.seal:before{content:"";position:absolute;inset:10px;border:1px solid rgba(157,137,102,.58);border-radius:50%}
.seal span{position:relative;font:24px "Cormorant Garamond",serif;letter-spacing:.08em}
.stage.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.7);pointer-events:none}
.cover-copy{
  position:absolute;z-index:6;left:0;right:0;bottom:8%;text-align:center;pointer-events:none;
  color:#78818a;transition:opacity .45s ease
}
.cover-names{font:300 25px "Cormorant Garamond",serif;letter-spacing:.12em}
.cover-prompt{margin-top:9px;font-size:8px;letter-spacing:.22em;text-transform:uppercase}
.stage.open .cover-copy{opacity:0}
.music-control{
  position:absolute;z-index:12;right:24px;bottom:22px;display:flex;align-items:center;gap:8px;
  border:1px solid rgba(173,155,122,.5);border-radius:30px;padding:10px 14px;
  color:#56667a;background:rgba(250,248,242,.88);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s ease
}
.stage.open .music-control{opacity:1;pointer-events:auto}
.music-control[hidden]{display:none}
.music-icon{font-size:16px;color:#a48c62}
.music-credit{
  position:absolute;z-index:3;bottom:14px;left:14px;right:125px;text-align:center;
  font-size:7px;letter-spacing:.04em;color:#898781
}
.music-credit a{text-decoration:none;border-bottom:1px solid rgba(137,135,129,.35)}
.butterflies{position:absolute;inset:0;z-index:4;overflow:hidden;pointer-events:none;opacity:0;transition:opacity 1.2s ease .6s}
.stage.open .butterflies{opacity:1}
.butterfly{
  position:absolute;width:24px;height:19px;opacity:0;color:#fffdf5;
  filter:drop-shadow(0 1px 2px rgba(70,80,91,.17));
  animation:flight var(--duration,27s) linear var(--delay,0s) infinite
}
.butterfly svg{width:100%;height:100%;overflow:visible}
.butterfly .wing{fill:rgba(255,253,246,.92);stroke:rgba(255,255,255,.85);stroke-width:.6}
.butterfly .vein{fill:none;stroke:rgba(179,166,144,.55);stroke-width:.55;stroke-linecap:round}
.butterfly .body,.butterfly .antenna{fill:none;stroke:#e8e0d1;stroke-width:.8;stroke-linecap:round}
.butterfly .wing-pair{transform-box:fill-box;transform-origin:center;animation:flap .75s ease-in-out infinite alternate}
@keyframes flight{
  0%{opacity:0;transform:translate3d(0,15vh,0) rotate(-8deg)}
  10%{opacity:.68}
  40%{transform:translate3d(var(--drift,24px),-38vh,0) rotate(7deg)}
  82%{opacity:.55}
  100%{opacity:0;transform:translate3d(calc(var(--drift,24px) * -.7),-108vh,0) rotate(-5deg)}
}
@keyframes flap{to{transform:scaleX(.7)}}
@media(max-width:520px){
  .stage{height:100svh;min-height:560px;max-height:none;box-shadow:none}
  .invite-copy{margin-left:10%;padding:25px 12px 35px}
  .pampas{left:-17%;width:82%;height:73%}
  .envelope-botanical{height:28%}
  .music-control{right:18px;bottom:20px}
}
@media(max-height:700px){
  .stage{min-height:0}
  .invite-copy{padding-top:12px;padding-bottom:30px}
  .eyebrow{margin-bottom:18px}
  .date{margin-top:22px}
  .pampas{height:68%}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .butterflies{display:none}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <section class="invitation-card" aria-label="Весільне запрошення">
    <div class="paper-edge"></div>
    <svg class="pampas" viewBox="0 0 260 700" preserveAspectRatio="xMinYMax meet" aria-hidden="true">
      <defs>
        <linearGradient id="grass" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#b9b4a8" stop-opacity=".16"/><stop offset=".7" stop-color="#fdfbf5" stop-opacity=".9"/><stop offset="1" stop-color="#d8d3c8" stop-opacity=".32"/></linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation=".35"/></filter>
      </defs>
      <g fill="none" stroke="#c9c4b8" stroke-width="1.2" opacity=".78">
        <path d="M17 700Q42 478 93 105M54 700Q70 472 159 201M95 700Q111 520 214 314M12 700Q-2 488 38 253M140 700Q156 533 242 412"/>
        <path d="M93 105Q56 120 48 169M93 105Q119 131 120 177M159 201Q118 211 108 262M159 201Q193 226 192 273M214 314Q178 322 164 365M214 314Q246 334 245 376M38 253Q5 265 3 304M38 253Q67 271 68 311M242 412Q211 421 202 459M242 412Q259 430 258 463"/>
      </g>
      <g fill="url(#grass)" stroke="#d1ccbf" stroke-width=".55" filter="url(#soft)">
        <path d="M92 104C54 97 34 66 52 35c15-25 40-20 46-1 13-22 39-14 36 8 20-3 25 21 11 37-13 16-31 26-53 25z"/>
        <path d="M158 200c-42-8-57-36-40-62 13-20 35-16 42 1 14-20 36-12 34 8 18-1 24 17 12 33-11 15-29 24-48 25z"/>
        <path d="M213 313c-37-5-49-29-35-51 11-17 30-13 36 1 12-16 31-9 29 8 16 0 20 15 10 28-9 12-25 20-40 14z"/>
        <path d="M38 252c-33-5-44-26-32-46 10-15 27-12 32 1 11-15 28-8 26 7 14 0 18 13 9 25-8 11-22 18-35 13z"/>
        <path d="M241 411c-31-4-42-24-31-43 9-14 25-11 30 1 10-13 25-7 24 7 13 0 16 12 8 22-8 10-20 16-31 13z"/>
      </g>
      <g stroke="#bfb9ac" stroke-width=".65" opacity=".72">
        <path d="M57 54Q77 72 94 102M67 43Q83 65 94 101M81 37Q89 67 94 101M115 57Q105 77 95 102M129 75Q108 86 95 102"/>
        <path d="M126 155Q145 173 159 199M137 148Q151 169 159 199M154 145Q157 174 159 199M181 158Q170 180 159 199M194 178Q177 188 159 199"/>
        <path d="M184 338Q199 354 213 313M195 330Q206 347 213 313M217 330Q215 350 213 313M238 343Q224 355 213 313"/>
        <path d="M9 275Q24 289 38 252M17 268Q30 284 38 252M42 270Q39 288 38 252M58 286Q46 293 38 252"/>
      </g>
    </svg>
    <div class="invite-copy">
      <p class="eyebrow">З радістю запрошуємо вас</p>
      <h1 class="invite-name">Дар’я</h1>
      <div class="joiner">та</div>
      <div class="invite-name">Анатолій</div>
      <div class="date">17 · 07 · 2027</div>
      <div class="rule"></div>
      <div class="place">Ресторан «Фабіус»<small>Київ · 13:00</small></div>
      <p class="invite-note">Будемо щасливі розділити цей день з вами</p>
    </div>
    <div class="paper-edge"></div>
    <div class="butterflies" id="butterflies" aria-hidden="true"></div>
    <div class="music-credit"><a href="https://commons.wikimedia.org/wiki/File:01_-_Vivaldi_Spring_mvt_1_Allegro_-_John_Harrison_violin.ogg" target="_blank" rel="noopener noreferrer">Музика: Вівальді, «Весна», I. Allegro · John Harrison · CC BY-SA 4.0</a></div>
  </section>

  <div class="envelope" id="envelope">
    <div class="env-texture"></div>
    <div class="fold fold-bottom"></div><div class="fold fold-left"></div><div class="fold fold-right"></div>
    <svg class="envelope-botanical" viewBox="0 0 480 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g fill="none" stroke="#718092" stroke-width="1.1" stroke-linecap="round">
        <path d="M0 5Q98 40 142 165M480 5Q382 40 338 165M38 0Q122 43 157 148M442 0Q358 43 323 148"/>
        <path d="M142 165Q100 163 79 133M142 165Q172 137 177 106M157 148Q123 141 111 117M338 165Q380 163 401 133M338 165Q308 137 303 106M323 148Q357 141 369 117"/>
        <path d="M185 181Q178 103 216 18M295 181Q302 103 264 18M215 116Q185 100 180 69M215 116Q240 94 240 62M265 116Q295 100 300 69M265 116Q240 94 240 62"/>
      </g>
      <g fill="#718092" opacity=".18">
        <ellipse cx="215" cy="36" rx="10" ry="25" transform="rotate(15 215 36)"/>
        <ellipse cx="265" cy="36" rx="10" ry="25" transform="rotate(-15 265 36)"/>
        <ellipse cx="142" cy="165" rx="8" ry="22" transform="rotate(-45 142 165)"/>
        <ellipse cx="338" cy="165" rx="8" ry="22" transform="rotate(45 338 165)"/>
      </g>
    </svg>
    <button class="seal" id="openInvitation" type="button" aria-label="Відкрити запрошення з ініціалами Дар'ї та Анатолія"><span>Д&nbsp;А</span></button>
    <div class="cover-copy"><div class="cover-names">Дар’я &amp; Анатолій</div><div class="cover-prompt">Торкніться печатки, щоб відкрити</div></div>
  </div>

  <audio id="weddingMusic" preload="none" loop>
    <source src="https://commons.wikimedia.org/wiki/Special:Redirect/file/01_-_Vivaldi_Spring_mvt_1_Allegro_-_John_Harrison_violin.ogg" type="audio/ogg">
  </audio>
  <button class="music-control" id="musicToggle" type="button" aria-label="Увімкнути музику" hidden>
    <span class="music-icon" aria-hidden="true">♫</span><span id="musicLabel">Музика</span>
  </button>
</main>
<script>
const stage=document.getElementById("stage");
const openButton=document.getElementById("openInvitation");
const music=document.getElementById("weddingMusic");
const musicToggle=document.getElementById("musicToggle");
const musicLabel=document.getElementById("musicLabel");
function updateMusicButton(){
  const playing=!music.paused;
  musicLabel.textContent=playing?"Пауза":"Музика";
  musicToggle.setAttribute("aria-label",playing?"Поставити музику на паузу":"Увімкнути музику");
}
function playMusic(){
  const playback=music.play();
  if(playback&&typeof playback.then==="function") playback.then(updateMusicButton).catch(function(){musicLabel.textContent="Натисніть для музики";});
}
openButton.addEventListener("click",function(){
  stage.classList.add("open");
  openButton.disabled=true;
  musicToggle.hidden=false;
  playMusic();
  setTimeout(function(){startButterflies();},700);
});
musicToggle.addEventListener("click",function(){if(music.paused)playMusic();else music.pause();});
music.addEventListener("play",updateMusicButton);
music.addEventListener("pause",updateMusicButton);
function startButterflies(){
  const layer=document.getElementById("butterflies");
  if(!layer||layer.childElementCount)return;
  [15,82].forEach(function(left,index){
    const butterfly=document.createElement("span");
    butterfly.className="butterfly";
    butterfly.style.left=left+"%";
    butterfly.style.bottom=(-index*14)+"px";
    butterfly.style.setProperty("--duration",(29+index*5)+"s");
    butterfly.style.setProperty("--delay",(-index*9)+"s");
    butterfly.style.setProperty("--drift",(26-index*30)+"px");
    butterfly.innerHTML='<svg viewBox="0 0 60 48"><g class="wing-pair"><path class="wing" d="M29 23C23 18 15 3 8 4 1 5 3 15 12 21 6 19 2 22 4 28 6 34 18 34 29 27ZM31 23C37 18 45 3 52 4 59 5 57 15 48 21 54 19 58 22 56 28 54 34 42 34 31 27ZM29 26C22 28 12 30 10 37 8 44 20 43 29 30ZM31 26C38 28 48 30 50 37 52 44 40 43 31 30Z"/></g><path class="vein" d="M29 24C22 18 14 8 7 6M28 25C20 23 12 22 5 24M31 24C38 18 46 8 53 6M32 25C40 23 48 22 55 24M28 27C20 31 15 36 12 40M32 27C40 31 45 36 48 40"/><path class="body" d="M30 19V37M29 20 23 13M31 20 37 13"/></svg>';
    layer.appendChild(butterfly);
  });
}
</script>
</body>
</html>
