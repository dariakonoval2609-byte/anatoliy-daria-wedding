<style>
:root{
  --blue:#7e95af;
  --blue-dark:#294463;
  --blue-deep:#203a59;
  --blue-light:#c1cfdd;
  --ivory:#f8f3e9;
  --cream:#e9dfce;
  --gold:#c6a66d;
  --gold-light:#f0ddb2;
  --ink:#34445a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{
  background:var(--ivory);color:var(--ink);
  font-family:Montserrat,sans-serif;font-weight:300;line-height:1.8
}
body.locked{overflow:hidden}
img{display:block;width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit}
section{position:relative}
.container{width:min(1080px,90%);margin:auto}
/* =====================================
   СТАРТОВЕ ЗАПРОШЕННЯ
===================================== */
.cover{
  position:fixed;inset:0;z-index:10000;
  display:flex;align-items:center;justify-content:center;
  padding:24px 20px;overflow-y:auto;
  background:radial-gradient(ellipse at center,#faf5e9 0%,#eee3d0 72%,#ddcfb8 100%);
  transition:opacity .9s ease,visibility .9s ease;
}
.cover.gone{opacity:0;visibility:hidden;pointer-events:none}
.cover-content{
  width:min(490px,100%);text-align:center;
  padding:25px 0;margin:auto;position:relative
}
.cover-label{
  font-size:10px;letter-spacing:5px;text-transform:uppercase;
  color:var(--blue-deep);margin-bottom:32px
}
.cover-flourish{
  position:absolute;color:#b9a17a;opacity:.43;
  font-family:"Cormorant Garamond",serif;font-size:95px;
  line-height:1;pointer-events:none
}
.flourish-top{top:25px;left:0;transform:rotate(-35deg)}
.flourish-bottom{bottom:70px;right:0;transform:rotate(145deg)}
.envelope-scene{
  width:100%;max-width:430px;margin:0 auto 38px;
  perspective:1400px;position:relative
}
.envelope{
  width:100%;aspect-ratio:1.22/1;position:relative;
  filter:drop-shadow(0 22px 22px rgba(38,54,72,.2));
  transform-style:preserve-3d
}
.env-paper{
  position:absolute;inset:0;overflow:hidden;
  background:
    linear-gradient(135deg,rgba(255,255,255,.18),transparent 40%),
    linear-gradient(145deg,#8da4bd,#7089a5 58%,#617b99);
  border:1px solid #d9c5a0
}

  background-size:150px 150px
}
.env-paper::after{
  content:"";position:absolute;inset:8px;
  border:1px solid rgba(241,221,182,.8);
  pointer-events:none
}
.env-left,.env-right,.env-bottom{
  position:absolute;inset:0;pointer-events:none
}
.env-left{
  z-index:2;
  background:linear-gradient(120deg,rgba(196,210,225,.6),rgba(68,90,117,.25));
  clip-path:polygon(0 0,50% 50%,0 100%)
}
.env-right{
  z-index:2;
  background:linear-gradient(240deg,rgba(193,207,222,.65),rgba(54,77,104,.28));
  clip-path:polygon(100% 0,50% 50%,100% 100%)
}
.env-bottom{
